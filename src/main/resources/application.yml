server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: taskapp
  
  # Web configuration
  web:
    resources:
      static-locations: classpath:/static/
  
  # Jackson JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

# Management endpoints (actuator)
management:
  endpoints:
    web:
      exposure:
        include: ['health', 'info', 'metrics']
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: INFO
    com.techwave.taskapp: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/taskapp.log

# CORS configuration (handled in WebConfig but documented here)
cors:
  allowed-origins: 
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "file://"
  allowed-methods: 
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# App-specific configuration
app:
  task:
    validation:
      title-max-length: 255
      description-max-length: 2000
    storage:
      type: in-memory
      initial-capacity: 1000